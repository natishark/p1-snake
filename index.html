<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Snake</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header class="site-header">
            <a href="/" class="logo-link">
                <img src="/assets/snake-logo.svg" alt="Логотип сайта игра 'Змейка'" class="logo-img">
                <span class="site-name">Snake</span>
            </a>
        </header>
        <div class="game-body">
            <section class="game-actions">
                <h2 id="actions-heading" class="visually-hidden">Game controls</h2>
                <p class="score-info">Score: <span id="fld-current-score">0</span></p>
                <div class="buttons-section">
                    <button id="btn-play">
                        <svg aria-labelledby="play-icon-title" fill="#000000" width="800px" height="800px" viewBox="0 0 22 22" xmlns="http://www.w3.org/2000/svg" id="memory-menu-right-fill">
                            <title id="play-icon-title">Play button</title>
                            <path d="M9 5H8V17H9V16H10V15H11V14H12V13H13V12H14V10H13V9H12V8H11V7H10V6H9" />
                        </svg>
                    </button>
                    <button id="btn-pause" disabled>
                        <svg aria-labelledby="pause-icon-title" fill="#000000" width="800px" height="800px" viewBox="0 0 22 22" xmlns="http://www.w3.org/2000/svg" id="memory-pause">
                            <title id="pause-icon-title">Pause button</title>
                            <path d="M6 4H9V18H6V4M13 18V4H16V18H13Z" />
                        </svg>
                    </button>
                    <button id="btn-restart">
                        <svg aria-labelledby="restart-icon-title" fill="#000000" width="800px" height="800px" viewBox="0 0 22 22" xmlns="http://www.w3.org/2000/svg" id="memory-rotate-clockwise">
                            <title id="restart-icon-title">Restart button</title>                            
                            <path d="M22 11V12H21V13H20V14H19V15H17V14H16V13H15V12H14V11H17V9H16V7H15V6H13V5H9V6H7V7H6V9H5V13H6V15H7V16H9V17H13V16H16V18H14V19H8V18H6V17H5V16H4V14H3V8H4V6H5V5H6V4H8V3H14V4H16V5H17V6H18V8H19V11H22Z" />
                        </svg>
                    </button>
                </div>
                <p class="score-info">Best score: <span id="fld-best-score">0</span></p>
            </section>
            <canvas id="field">Sorry</canvas>
            <script type="module" src="index.js"></script>
        </div>
    </body>
</html>
